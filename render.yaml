version: "1"

services:
  - type: web
    name: excaliadrw-http-server
    env: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./docker/Dockerfile.backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PUBLIC_URL
        value: https://excaliadrw-http-server.onrender.com
      - key: PORT
        value: 3001

  - type: web
    name: excaliadrw-ws-backend
    env: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./docker/Dockerfile.websocket
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PUBLIC_URL
        value: https://excaliadrw-ws-backend.onrender.com
      - key: PORT
        value: 8080
